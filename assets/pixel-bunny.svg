<svg xmlns="http://www.w3.org/2000/svg" width="160" height="150" viewBox="0 0 160 150" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
  <title id="title">Panchito pixel bunny</title>
  <desc id="desc">A cute ash-gray lop-eared pixel bunny inspired by Panchito.</desc>

  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -2;0 0" dur="1.8s" repeatCount="indefinite"/>

    <!-- lop ears -->
    <rect x="24" y="35" width="22" height="54" rx="7" fill="#6b7280"/>
    <rect x="114" y="39" width="22" height="58" rx="7" fill="#6b7280"/>
    <rect x="29" y="42" width="12" height="39" rx="5" fill="#9ca3af"/>
    <rect x="119" y="46" width="12" height="43" rx="5" fill="#9ca3af"/>

    <!-- round ash-gray head -->
    <rect x="43" y="18" width="74" height="72" rx="20" fill="#9ca3af"/>
    <rect x="49" y="24" width="62" height="60" rx="18" fill="#a7adb7"/>

    <!-- tiny face -->
    <rect x="62" y="52" width="6" height="7" rx="2" fill="#111827"/>
    <rect x="92" y="52" width="6" height="7" rx="2" fill="#111827"/>
    <rect x="77" y="64" width="6" height="5" rx="2" fill="#6b4f55"/>
    <rect x="79" y="69" width="2" height="5" fill="#4b5563"/>

    <!-- compact body -->
    <rect x="51" y="84" width="58" height="47" rx="16" fill="#8f96a3"/>
    <rect x="61" y="93" width="38" height="31" rx="12" fill="#aeb4bd"/>

    <!-- paws together -->
    <rect x="62" y="112" width="17" height="14" rx="5" fill="#c5c9cf"/>
    <rect x="81" y="112" width="17" height="14" rx="5" fill="#c5c9cf"/>
    <rect x="76" y="114" width="8" height="12" rx="3" fill="#d6d9dd"/>

    <!-- feet -->
    <rect x="48" y="126" width="26" height="12" rx="5" fill="#7d8592"/>
    <rect x="86" y="126" width="26" height="12" rx="5" fill="#7d8592"/>

    <!-- little tail -->
    <rect x="108" y="101" width="15" height="15" rx="6" fill="#b9bec6"/>

    <!-- blink -->
    <animate
      attributeName="opacity"
      values="1;1;0.92;1"
      keyTimes="0;0.88;0.92;1"
      dur="4.5s"
      repeatCount="indefinite"/>
  </g>
</svg>