<svg width="1200" height="390" viewBox="0 0 1200 390" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="title">Joel Saravia — Software Engineer</title>
  <desc id="desc">A systems-style banner connecting operations, software systems, APIs, data, automation, and applied AI.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A1020"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#94A3B8" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="390" rx="26" fill="url(#background)"/>
  <rect width="1200" height="390" rx="26" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="388" rx="25" stroke="#E2E8F0" stroke-opacity="0.08"/>

  <!-- Identity -->
  <g>
    <text x="60" y="82" fill="#7DD3FC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" letter-spacing="2.4">SOFTWARE ENGINEER</text>
    <text x="60" y="145" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="54" font-weight="800" letter-spacing="-1.2">JOEL SARAVIA</text>
    <text x="60" y="190" fill="#D7E0EA" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="500">Business systems · integrations · automation · applied AI</text>

    <line x1="60" y1="232" x2="505" y2="232" stroke="#22D3EE" stroke-width="2" stroke-linecap="round" opacity="0.9"/>

    <text x="60" y="274" fill="#8FA4BC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">operational problem → architecture → software → production</text>
  </g>

  <!-- System map connections -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" opacity="0.8">
    <path d="M760 111H824" stroke="#38BDF8"/>
    <path d="M880 134V185" stroke="#60A5FA"/>
    <path d="M936 111H994" stroke="#818CF8"/>
    <path d="M936 208H994" stroke="#818CF8"/>
    <path d="M760 255H824" stroke="#60A5FA"/>
    <path d="M936 208L1010 274" stroke="#8B5CF6"/>
    <path d="M936 255H994" stroke="#8B5CF6"/>
  </g>

