<svg xmlns="http://www.w3.org/2000/svg" width="144" height="144" viewBox="0 0 144 144" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
  <title id="title">Pixel bunny</title>
  <desc id="desc">A small cute animated pixel bunny.</desc>

  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 3;0 0" dur="1.4s" repeatCount="indefinite"/>

    <!-- ears -->
    <rect x="44" y="18" width="16" height="40" rx="2" fill="#f3f4f6"/>
    <rect x="84" y="18" width="16" height="40" rx="2" fill="#f3f4f6"/>
    <rect x="48" y="24" width="8" height="26" fill="#f9a8d4"/>
    <rect x="88" y="24" width="8" height="26" fill="#f9a8d4"/>

    <!-- head -->
    <rect x="36" y="48" width="72" height="56" rx="6" fill="#f3f4f6"/>
    <rect x="28" y="60" width="12" height="30" fill="#f3f4f6"/>
    <rect x="104" y="60" width="12" height="30" fill="#f3f4f6"/>

    <!-- eyes -->
    <rect x="52" y="68" width="7" height="9" fill="#111827">
      <animate attributeName="height" values="9;9;1;9" keyTimes="0;0.86;0.90;1" dur="4s" repeatCount="indefinite"/>
    </rect>
    <rect x="85" y="68" width="7" height="9" fill="#111827">
      <animate attributeName="height" values="9;9;1;9" keyTimes="0;0.86;0.90;1" dur="4s" repeatCount="indefinite"/>
    </rect>

    <!-- cheeks -->
    <rect x="43" y="82" width="10" height="5" fill="#fbcfe8"/>
    <rect x="91" y="82" width="10" height="5" fill="#fbcfe8"/>

    <!-- nose + mouth -->
    <rect x="68" y="80" width="8" height="6" fill="#f472b6"/>
    <rect x="70" y="86" width="4" height="6" fill="#111827"/>
    <rect x="62" y="90" width="8" height="4" fill="#111827"/>
    <rect x="74" y="90" width="8" height="4" fill="#111827"/>

    <!-- body -->
    <rect x="46" y="102" width="52" height="26" rx="4" fill="#e5e7eb"/>
    <rect x="34" y="112" width="18" height="12" fill="#e5e7eb"/>
    <rect x="92" y="112" width="18" height="12" fill="#e5e7eb"/>

    <!-- feet -->
    <rect x="44" y="126" width="20" height="8" fill="#d1d5db"/>
    <rect x="80" y="126" width="20" height="8" fill="#d1d5db"/>

    <!-- tiny tail -->
    <rect x="104" y="108" width="12" height="12" rx="2" fill="#f3f4f6"/>
  </g>
</svg>