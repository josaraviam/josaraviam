<svg xmlns="http://www.w3.org/2000/svg" width="220" height="190" viewBox="0 0 220 190" role="img" aria-labelledby="title desc">
  <title id="title">Terminal buddy</title>
  <desc id="desc">A small robot-like terminal mascot made from code-inspired lines.</desc>
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g fill="none" stroke="#22c55e" stroke-width="3" stroke-linejoin="round" filter="url(#glow)">
    <path d="M76 25h68l12 12v48l-12 12H76L64 85V37z"/>
    <path d="M84 97v18H70l-10 15v34h28v-22h44v22h28v-34l-10-15h-14V97"/>
    <path d="M91 164v16H70"/>
    <path d="M129 164v16h21"/>
    <path d="M110 25V12"/>
    <path d="M110 12l10-6"/>
  </g>

  <g fill="#22c55e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">
    <text x="74" y="43">&gt; boot --curious</text>
    <text x="74" y="57">api.connect()</text>
    <text x="74" y="71">status: 200 ✓</text>
    <text x="74" y="85">ship_it();</text>

    <text x="73" y="124">RAG  API  CI</text>
    <text x="74" y="139">n8n  ☁  &lt;/&gt;</text>
    <text x="74" y="154">MCP? maybe.</text>
  </g>

  <g fill="#38bdf8" filter="url(#glow)">
    <rect x="82" y="32" width="7" height="7" rx="1"/>
    <rect x="131" y="32" width="7" height="7" rx="1"/>
    <rect x="104" y="105" width="12" height="5" rx="2"/>
  </g>

  <g stroke="#22c55e" stroke-width="2" stroke-linecap="round" opacity=".7">
    <path d="M43 48h14"/>
    <path d="M37 59h20"/>
    <path d="M46 70h11"/>
    <path d="M163 48h14"/>
    <path d="M163 59h20"/>
    <path d="M163 70h11"/>
